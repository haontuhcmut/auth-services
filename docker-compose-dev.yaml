services:
  auth-postgres:
    image: postgres:17-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - auth-network

  auth-redis:
    image: redis:8-alpine
    container_name: auth-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - auth-network

  auth-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-migrate
    env_file:
      - .env
    command:
      - uv
      - run
      - --no-sync
      - alembic
      - upgrade
      - head
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - auth-network
    restart: "no"

  auth-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-api
    restart: unless-stopped
    env_file:
      - .env
    command:
      - uv
      - run
      - --no-sync
      - fastapi
      - dev
      - app/main.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    networks:
      - auth-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: auth-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - auth-network

volumes:
  auth-postgres-data:
  auth-redis-data:

networks:
  auth-network:
    name: auth-network
