repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3  # Hoặc version ruff bạn đang dùng
    hooks:
      # Run the linter (tự động đọc rules từ pyproject.toml)
      - id: ruff-check
        args: [--fix]
      # Run the formatter
      - id: ruff-format

    # Prevent accidental commits of secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(alembic\.ini|alembic/versions/.*\.py)$